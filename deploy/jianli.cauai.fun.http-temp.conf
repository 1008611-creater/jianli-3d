# 临时配置：等 certbot 签发证书后会被正式配置覆盖
# 保留完整的静态资源缓存规则，以便 DNS 生效后立即可用
server {
    listen 80;
    listen [::]:80;
    server_name jianli.cauai.fun;
    root /var/www/jianli;
    index index.html;

    access_log /var/log/nginx/jianli.access.log;
    error_log  /var/log/nginx/jianli.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 带内容 hash 的构建产物：永久缓存
    location ~* ^/assets/(index|react|r3f|three)-[A-Za-z0-9_-]+\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # 本地自托管字体
    location /assets/fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        types { font/woff2 woff2; }
        default_type font/woff2;
        access_log off;
    }

    # 3D 模型：大文件，预压缩 + 长期缓存
    location /assets/models/ {
        expires 30d;
        add_header Cache-Control "public" always;
        gzip_static on;
        default_type model/gltf-binary;
    }

    location /assets/stickers/ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location /assets/thumbs/ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    location /assets/env/ {
        expires 30d;
        add_header Cache-Control "public" always;
        default_type application/octet-stream;
        access_log off;
    }
}
